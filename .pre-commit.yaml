repos:
  - repo: local
    hooks:
      - id: cpp-format
        name: cpp-format
        entry: make cpp-format
        language: system
        pass_filenames: false
      - id: lint-format
        name: py-lint-format
        entry: make py-lint-fix
        language: system
        pass_filenames: false
      - id: native-build
        name: native-build
        entry: make native-build
        language: system
        pass_filenames: false
      - id: native-test
        name: native-test
        entry: make native-test
        language: system
        pass_filenames: false
      - id: py-test
        name: py-test
        entry: make py-test PYTEST_ARGS="-ra"
        language: system
        pass_filenames: false
