[build-system]
requires = ["setuptools>=68.0", "wheel", "pybind11>=3.1,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "TCalc"
version = "0.6.3"
description = "Advanced calculator with expression parsing"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tahsin Önemli", email = "tahsin.onemli90@gmail.com" }]
keywords = ["calculator", "parser", "shunting-yard", "rpn", "gui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = ["PySide6>=6.12.0,<6.13", "pybind11>=3.1,<4"]

[project.optional-dependencies]
dev = [
  "mypy>=2.4,<3",
  "pre-commit>=4.7,<5",
  "pybind11-stubgen>=3.0.0,<3.1",
  "ruff==0.15.0",
  "pytest>=9.1,<9.2",
  "pytest-benchmark>=5.3,<6",
  "pytest-qt>=4.5,<5",
  "pytest-memray>=1.11,<2",
  "pyinstrument>=5.1,<6",
]

[project.scripts]
calculator = "tcalc.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["tcalc*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "stubs", "venv", "src/native", "src/calc_native*.so"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["tcalc"]

[tool.mypy]
mypy_path = "stubs:src"
files = ["src"]
exclude = ["src/tcalc/core/ops.py"]
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["PySide6.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["calc_native", "calc_native.*"]
ignore_missing_imports = true

[tool.pyright]
stubPath = "stubs"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/"]
filterwarnings = ["ignore::pytest_benchmark.logger.PytestBenchmarkWarning"]
markers = [
    "benchmark: performance benchmark tests",
    "flamegraph: pyinstrument flamegraph profiling tests",
]
addopts = "--benchmark-time-unit=ms"

[tool.pytest-benchmark]
group_by = "group"
