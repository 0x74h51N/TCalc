name: CI

on:
  pull_request:
    branches:
      - master
    # A fixed description has to reach the jobs it held back
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# A push while the jobs run replaces them. An edit waits for them instead, then runs no job
# when they passed, so editing the description right after opening does not restart them.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event.action != 'edited' }}

env:
  PYTHON_VERSION: "3.14.5"

jobs:
  # First of all: the contributor signed the agreement. cla-rerun.yml restarts the run when they do.
  cla-check:
    name: CLA Check
    runs-on: ubuntu-24.04
    steps:
      # The release pull request comes from the workflow, and a bot cannot sign
      - name: Check the signature
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'github-actions[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SIGN: https://cla-assistant.io/${{ github.repository }}?pullRequest=${{ github.event.number }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status" --jq '.statuses[] | select(.context == "license/cla") | .state')
          if [ "$state" != success ]; then
            echo "The contributor license agreement is not signed (license/cla: ${state:-no answer})."
            echo "Sign it at $SIGN and CI starts again by itself."
            exit 1
          fi

  # Then the title is the changelog line (docs/release.md) and carries no trap word.
  # Every other job waits on this one.
  pr-title:
    name: Pull Request Title
    needs: cla-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'

      - name: Check the title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^((feat|fix|perf|refactor|docs|test|ci|chore|build)(/[a-z0-9-]+)?: [^[:space:]]|release: v[0-9]+\.[0-9]+\.[0-9]+$)'
          if ! printf '%s\n' "$TITLE" | grep -Eq "$pattern"; then
            echo "Title does not match: $pattern"
            echo "Title: $TITLE"
            exit 1
          fi
          # The word lives in the template's comment, so it has one home
          word=$(sed -nE 's/.*add the word "(\w+)" to the title.*/\1/p' .github/pull_request_template.md)
          if printf '%s\n' "$TITLE" | grep -qiF "$word"; then
            echo "Unsupervised AI agents are prohibited: see docs/CONTRIBUTING.md"
            exit 1
          fi

  # The one place that decides which job a PR needs; every other job reads its flag.
  changes:
    name: Changed Paths
    needs: pr-title
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      cpp-format-check: ${{ steps.rules.outputs.cpp-format-check }}
      py-format-check: ${{ steps.rules.outputs.py-format-check }}
      native-build: ${{ steps.rules.outputs.native-build }}
      cpp-code-check: ${{ steps.rules.outputs.cpp-code-check }}
      py-typecheck: ${{ steps.rules.outputs.py-typecheck }}
      native-test: ${{ steps.rules.outputs.native-test }}
      py-test: ${{ steps.rules.outputs.py-test }}
      py-test-benchmark: ${{ steps.rules.outputs.py-test-benchmark }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Map changed paths to jobs
        id: rules
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          TITLE_CHANGED: ${{ github.event.changes.title != null }}
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          passed=0
          if [ "$ACTION" = edited ]; then
            # On its own line so a failed query fails the job, never reads as a pass
            passed=$(gh run list --workflow CI --commit "$HEAD_SHA" --status success --json databaseId --jq length)
          fi
          # scripts/changed_jobs maps the changed paths to jobs; the pre-push hook reads the same rules
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "Manual run: every job runs." >&2
            scripts/changed_jobs --all < /dev/null
          elif [ "$passed" -gt 0 ]; then
            # Editing the title or description reruns CI too; its commit has already passed
            echo "Description edit on a commit CI passed: no job runs." >&2
            scripts/changed_jobs < /dev/null
          elif [ "$ACTION" = edited ] && [ "$TITLE_CHANGED" != true ]; then
            # A description edit never reruns the jobs; it keeps the failure instead of hiding it
            echo "Description edit on a commit CI did not pass: rerun that run by hand." >&2
            exit 1
          else
            git diff --name-only "$BASE_SHA...$HEAD_SHA" | scripts/changed_jobs
          fi | tee -a "$GITHUB_OUTPUT"

  cpp-format-check:
    name: C++ Format Check (clang-format)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.cpp-format-check == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Same pin as pyproject's dev extra
      - name: Install clang-format
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install "pip>=26.2,<26.3"
          .venv/bin/pip install "clang-format>=21.1,<21.2"

      - name: Run format check
        run: make cpp-format-check

  py-format-check:
    name: Python Format Check (ruff)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.py-format-check == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install "pip>=26.2,<26.3"
          pip install -e ".[dev]"

      - name: Run ruff checks
        run: |
          . .venv/bin/activate
          make py-lint

  native-build:
    name: Native Build
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.native-build == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libboost-dev

      - name: Build native (Debug) and generate stubs
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install "pip>=26.2,<26.3"
          pip install -e ".[dev]"
          make native-build NATIVE_BUILD_TYPE=Debug

      - name: Upload native build artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-build-debug
          path: |
            src/native/build/native
            stubs
            src/calc_native*.so

  cpp-code-check:
    name: C++ Code Quality (clang-tidy)
    runs-on: ubuntu-24.04
    needs: [changes, native-build]
    if: needs.changes.outputs.cpp-code-check == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install clang-tidy deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy cmake ninja-build g++ libboost-dev python3-dev
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install "pip>=26.2,<26.3"
          # Same pins as pyproject; run-clang-tidy comes from the apt clang-tidy
          pip install "pybind11>=3.1,<3.2" "clang-tidy>=21.1,<21.2"

      - name: Download native build artifact (for compile_commands.json)
        uses: actions/download-artifact@v4
        with:
          name: native-build-debug

      - name: Run clang-tidy (diff only)
        env:
          # A manual run has no PR base, so it diffs against the default branch.
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE:refs/remotes/origin/$BASE"
          . .venv/bin/activate
          make cpp-tidy-diff BASE_REF="origin/$BASE"

  py-typecheck:
    name: Python Type Check (mypy)
    runs-on: ubuntu-24.04
    needs: [changes, native-build]
    if: needs.changes.outputs.py-typecheck == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install python deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install "pip>=26.2,<26.3"
          pip install -e ".[dev]"

      - name: Download native build artifact
        uses: actions/download-artifact@v4
        with:
          name: native-build-debug

      - name: Run mypy
        run: |
          . .venv/bin/activate
          make typecheck

  native-test:
    name: Native Tests
    runs-on: ubuntu-24.04
    needs: [changes, native-build]
    if: needs.changes.outputs.native-test == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Download native build artifact
        uses: actions/download-artifact@v4
        with:
          name: native-build-debug

      - name: Fix native test permissions
        run: |
          chmod +x src/native/build/native/native_tests || true

      - name: Run native tests (ctest)
        run: make native-ctest NATIVE_TEST_ARGS=--verbose

  py-test:
    name: Python Tests
    runs-on: ubuntu-24.04
    needs: [changes, native-build]
    if: needs.changes.outputs.py-test == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install Qt system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libx11-xcb1 \
            libxrender1 \
            libxrandr2 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libxcb-cursor0

      - name: Install python deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install "pip>=26.2,<26.3"
          pip install -e ".[dev]"

      - name: Download native build artifact
        uses: actions/download-artifact@v4
        with:
          name: native-build-debug

      - name: Run py-tests
        run: |
          . .venv/bin/activate
          make py-test PYTEST_ARGS="-rA -s"

  py-test-benchmark:
    name: Benchmark Tests
    runs-on: ubuntu-24.04
    needs:
      - changes
      - py-test
      - native-test
      - py-typecheck
      - cpp-code-check
      - native-build
    # The test jobs it waits for may be skipped; only a failure stops it.
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.py-test-benchmark == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-xcb1 libxrender1 libxrandr2 \
            libxkbcommon-x11-0 libegl1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-cursor0

      - name: Install python deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install "pip>=26.2,<26.3"
          pip install -e ".[dev]"

      - name: Download native build artifact
        uses: actions/download-artifact@v4
        with:
          name: native-build-debug

      - name: Seed benchmark history storage
        run: |
          . .venv/bin/activate
          make seed-history

      - name: Run benchmark tests
        run: |
          . .venv/bin/activate
          xvfb-run --auto-servernum make py-benchmark PYTEST_ARGS="-q --tb=line"

      - name: Run malloc tests
        run: |
          . .venv/bin/activate
          xvfb-run --auto-servernum make py-mem-profile PYTEST_ARGS="-q --tb=line"

  # The one required check: a skipped job passes, a failed or cancelled one does not.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - cla-check
      - pr-title
      - changes
      - cpp-format-check
      - py-format-check
      - native-build
      - cpp-code-check
      - py-typecheck
      - native-test
      - py-test
      - py-test-benchmark
    steps:
      - name: Fail on a failed or cancelled job
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
