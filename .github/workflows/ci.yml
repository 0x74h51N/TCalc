name: CI

on:
  pull_request:
    branches:
      - master

jobs:
  cpp-format-check:
    name: C++ Format Check (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Run format check
        run: make cpp-format-check

  cpp-code-check:
    name: C++ Code Quality (clang-tidy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-tidy g++ libboost-dev
          python -m venv venv
          . venv/bin/activate
          python -m pip install --upgrade pip
          pip install pybind11

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build/native
          key: clang-tidy-${{ runner.os }}-${{hashFiles('src/native/CMakeLists.txt', 'src/native/CMakeLists.txt', '.clang-tidy', 'CMakePresets.json') }}
          restore-keys: |
            clang-tidy-${{ runner.os }}-

      - name: Run clang-tidy
        run: |
          set -euo pipefail
          . venv/bin/activate
          make cpp-tidy-diff

  py-format-check:
    name: Python Format Check (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: |
          python -m venv venv
          . venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff

      - name: Run ruff checks
        run: |
          . venv/bin/activate
          make py-lint

  py-typecheck:
    name: Python Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: |
          python -m venv venv
          . venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install mypy

      - name: Build native extension and generate stubs
        run: |
          . venv/bin/activate
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-15 libboost-dev python3-dev
          make native-build NATIVE_BUILD_TYPE=Debug
          make stub-gen

      - name: Run mypy
        run: |
          . venv/bin/activate
          make typecheck

  native-test:
    name: Native Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libboost-dev
          python -m venv venv
          . venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build/native
          key: native-test-${{ runner.os }}-${{ hashFiles('src/native/**', 'src/native/CMakeLists.txt', '.clang-tidy') }}
          restore-keys: |
            native-test-${{ runner.os }}-

      - name: native test run
        run: |
          . venv/bin/activate
          make native-test

  py-test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libboost-dev
          python -m venv venv
          . venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build native extension
        run: |
          . venv/bin/activate
          make native-build NATIVE_BUILD_TYPE=Debug

      - name: Run py-tests
        run: |
          . venv/bin/activate
          make py-test
