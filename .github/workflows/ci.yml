name: CI

on:
  pull_request:
    branches:
      - master

env:
  PYTHON_VERSION: "3.14.5"

jobs:
  cpp-format-check:
    name: C++ Format Check (clang-format)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Same pin as pyproject's dev extra
      - name: Install clang-format
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install "pip>=26.2,<26.3"
          .venv/bin/pip install "clang-format>=21.1,<21.2"

      - name: Run format check
        run: make cpp-format-check

  py-format-check:
    name: Python Format Check (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install "pip>=26.2,<26.3"
          pip install -e ".[dev]"

      - name: Run ruff checks
        run: |
          . .venv/bin/activate
          make py-lint

  native-build:
    name: Native Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libboost-dev

      - name: Build native (Debug) and generate stubs
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install "pip>=26.2,<26.3"
          pip install -e ".[dev]"
          make native-build NATIVE_BUILD_TYPE=Debug

      - name: Upload native build artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-build-debug
          path: |
            src/native/build/native
            stubs
            src/calc_native*.so

  cpp-code-check:
    name: C++ Code Quality (clang-tidy)
    runs-on: ubuntu-24.04
    needs: native-build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install clang-tidy deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy cmake ninja-build g++ libboost-dev python3-dev
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install "pip>=26.2,<26.3"
          # Same pins as pyproject; run-clang-tidy comes from the apt clang-tidy
          pip install "pybind11>=3.1,<3.2" "clang-tidy>=21.1,<21.2"

      - name: Download native build artifact (for compile_commands.json)
        uses: actions/download-artifact@v4
        with:
          name: native-build-debug

      - name: Run clang-tidy (diff only)
        run: |
          set -euo pipefail
          git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}
          . .venv/bin/activate
          make cpp-tidy-diff BASE_REF=origin/${{ github.base_ref }}

  py-typecheck:
    name: Python Type Check (mypy)
    runs-on: ubuntu-24.04
    needs: native-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install python deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install "pip>=26.2,<26.3"
          pip install -e ".[dev]"

      - name: Download native build artifact
        uses: actions/download-artifact@v4
        with:
          name: native-build-debug

      - name: Run mypy
        run: |
          . .venv/bin/activate
          make typecheck

  native-test:
    name: Native Tests
    runs-on: ubuntu-24.04
    needs: native-build
    steps:
      - uses: actions/checkout@v4

      - name: Download native build artifact
        uses: actions/download-artifact@v4
        with:
          name: native-build-debug

      - name: Fix native test permissions
        run: |
          chmod +x src/native/build/native/native_tests || true

      - name: Run native tests (ctest)
        run: make native-ctest NATIVE_TEST_ARGS=--verbose

  py-test:
    name: Python Tests
    runs-on: ubuntu-24.04
    needs: native-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install Qt system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libx11-xcb1 \
            libxrender1 \
            libxrandr2 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libxcb-cursor0

      - name: Install python deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install "pip>=26.2,<26.3"
          pip install -e ".[dev]"

      - name: Download native build artifact
        uses: actions/download-artifact@v4
        with:
          name: native-build-debug

      - name: Run py-tests
        run: |
          . .venv/bin/activate
          make py-test PYTEST_ARGS="-rA -s"

  py-test-benchmark:
    name: Benchmark Tests
    runs-on: ubuntu-24.04
    needs:
      - py-test
      - native-test
      - py-typecheck
      - cpp-code-check
      - native-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-xcb1 libxrender1 libxrandr2 \
            libxkbcommon-x11-0 libegl1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-cursor0

      - name: Install python deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install "pip>=26.2,<26.3"
          pip install -e ".[dev]"

      - name: Download native build artifact
        uses: actions/download-artifact@v4
        with:
          name: native-build-debug

      - name: Seed benchmark history storage
        run: |
          . .venv/bin/activate
          make seed-history

      - name: Run benchmark tests
        run: |
          . .venv/bin/activate
          xvfb-run --auto-servernum make py-benchmark PYTEST_ARGS="-q --tb=line"

      - name: Run malloc tests
        run: |
          . .venv/bin/activate
          xvfb-run --auto-servernum make py-mem-profile PYTEST_ARGS="-q --tb=line"
