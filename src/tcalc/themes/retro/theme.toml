# Bundled example custom theme: green phosphor CRT terminal: black keys, scanlined green screen
name = "Retro"
# Built-in theme it builds on; this file holds only what differs from it
base = "dark"

# Overrides of the UI config's [fonts]
[fonts]
# VT323-Regular.ttf in this folder (OFL-1.1, see OFL-VT323.txt)
family_default = "VT323"
size_default = 18
# Keypad key font range (pt); VT323 draws small
keypad_min_pt = 14
keypad_max_pt = 24

# Square corners
[spacing]
radius_small = 0
radius_medium = 0
radius_large = 0

[colors]
# Green CRT glass with scanlines (the gradient repeats every 0.8% of the height)
screen = "qlineargradient(spread:repeat, x1:0, y1:0, x2:0, y2:0.01, stop:0 #0C4A0C, stop:0.5 #0C4A0C, stop:0.51 #083b08, stop:1 #063006)"
primary = "#33FF33"
primary_hover = "#66FF66"
primary_text = "#000000"
secondary = "#000000"
secondary_hover = "#0A2A0A"
secondary_text = "#33FF33"
accent = "#000"
accent_hover = "#0A2A0A"
accent_text = "#7CFF7C"
action = "#000000"
action_hover = "#0A2A0A"
action_text = "#B6FFB6"
background_dark = "#000000"
background_dark_alt = "#000A00"
background_medium = "#001000"
background_light = "#002000"
background = "#070707"
foreground = "#050505"
text_primary = "#33FF33"
text_secondary = "#22B822"
text_muted = "#167A16"
text_tertiary = "#167A16"
border_default = "#0F5A0F"
border_light = "#1A8A1A"
border_focus = "#33FF33"
border_dark = "#000000"
status_warn = "#FFB000"
status_error = "#FF3B3B"
status_info = "#33FF33"
status_success = "#33FF33"
selection_background = "#33FF33"
selection_text = "#000000"
control = "#002000"
control_hover = "#003800"
control_accent = "#7CFF7C"
icon = "#33FF33"
control_bg = "rgba(51, 255, 51, 8%)"
control_bg_hover = "rgba(51, 255, 51, 14%)"
control_bg_pressed = "rgba(51, 255, 51, 22%)"
control_disabled_bg = "rgba(51, 255, 51, 4%)"
control_disabled_text = "rgba(51, 255, 51, 30%)"
option_checked_bg = "rgba(51, 255, 51, 18%)"
option_hover_bg = "rgba(51, 255, 51, 10%)"
toast_info_bg = "rgba(0, 32, 0, 90%)"
toast_warn_bg = "rgba(255, 176, 0, 35%)"
toast_error_bg = "rgba(255, 59, 59, 35%)"
