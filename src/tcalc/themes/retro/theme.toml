# Bundled example custom theme: a 1995 desktop, gray raised keys around a white display
name = "Retro"
# Built-in theme it builds on; this file holds only what differs from it
base = "light"

# Overrides of the look's areas (look.toml); square corners everywhere
[fonts]
# VT323-Regular.ttf in this folder (OFL-1.1, see OFL-VT323.txt)
family_default = "VT323"
size_default = 18

[palette]
# Window parts follow the gray face; the lists keep their white
base_color = "background"

[display]
radical_line_color = "text_primary"
radical_symbol_color = "text_primary"

[display.expression]
slot_focus_color = "control_hover"

[display.expression.selection]
color = "selection_background"
text_color = "selection_text"

[result.fraction]
radius = 0

[result.fraction.text]
color = "text_primary"

[picker.text.font]
min_pt = 18

[menu.panel.text.font]
min_pt = 16

[menu.item]
radius = 0

# VT323 draws small, so every text area is a few points larger
[keypad.button]
radius = 0

[keypad.button.text.font]
min_pt = 14
max_pt = 24

# Raised keys, lit from the top left
[keypad.button.edge]
width = 2
light_color = "button_highlight"

[memory]
radius = 0

[memory.edge]
width = 2
light_color = "button_highlight"

[memory.text.font]
min_pt = 14
max_pt = 18

[options]
radius = 0

[options.text.font]
min_pt = 18

[options.edge]
width = 2
light_color = "button_highlight"

[history.text.font]
min_pt = 14
max_pt = 18

[history.expression.font]
min_pt = 14
max_pt = 20

[history.clear.text.font]
min_pt = 12
max_pt = 15

[history.result.font]
min_pt = 16
max_pt = 20

[history.mode]
radius = 0

[history.mode.text.font]
min_pt = 16

[history.mode.edge]
width = 2
light_color = "button_highlight"

[history.button]
radius = 0
hover_color = "control_hover"
pressed_color = "control_bg_pressed"

[history.button.edge]
light_color = "button_highlight"

[history.copy]
color = "background"

[history.delete]
color = "background"

[tooltip]
radius = 0

[toast]
radius = 0

[toast.text.font]
min_pt = 18

# Dock titles and tabs at the app font size, as before they had a setting
[dock.font]
min_pt = 18

[tabs.font]
min_pt = 18

[colors]
# The 1995 desktop: a gray face, a dark gray shadow under raised keys, navy selection
button_shadow = "#404040"
# The display is a white field, as the calculator of the era
screen = "#FFFFFF"
# Keys: digits navy, operators and actions red, as the calculator of the era
secondary = "#C0C0C0"
secondary_hover = "#A8A8A8"
secondary_text = "#000080"
accent = "#C0C0C0"
accent_hover = "#A8A8A8"
accent_text = "#800000"
action = "#C0C0C0"
action_hover = "#A8A8A8"
action_text = "#800000"
background_dark = "#FFFFFF"
# History rows: white and a light gray zebra
background_dark_alt = "#E0E0E0"
background_medium = "#C0C0C0"
background_light = "#C0C0C0"
background = "#C0C0C0"
text_primary = "#000000"
text_secondary = "#000000"
border_light = "#808080"
border_focus = "#000000"
status_error = "#C00000"
selection_background = "#000080"
selection_text = "#FFFFFF"
control = "#C0C0C0"
control_hover = "#CDCDCD"
control_accent = "#800000"
icon = "#000000"
control_bg = "#C0C0C0"
control_bg_hover = "#CDCDCD"
control_bg_pressed = "#A8A8A8"
control_disabled_bg = "#C0C0C0"
control_disabled_text = "#808080"
option_checked_bg = "#DCDCDC"
option_hover_bg = "#CDCDCD"
toast_info_bg = "#C0C0C0"
toast_warn_bg = "#FFFFE1"
toast_error_bg = "#FFB0B0"
