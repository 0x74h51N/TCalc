# Built-in light theme
name = "Light"

[spacing]
key_radius = 2
icon_button_radius = 2
tooltip_radius = 2
option_radius = 2
spinbox_radius = 2

[colors]
# Primary colors
primary = "#C9D6EE"
primary_hover = "#B8C8E6"
primary_text = "#1E1F24"

# Secondary colors
secondary = "#FFFFFF"
secondary_hover = "#E6E8ED"
secondary_text = "#1E1F24"

# Accent colors
accent = "#E9EBF0"
accent_hover = "#DCDFE6"
accent_text = "#E8590C"

# Action colors
action = "#E3E9F3"
action_hover = "#D3DCEB"
action_text = "#2B6CB0"

# Background colors
background_dark = "#FFFFFF"
background_dark_alt = "#F7F8FA"
background_medium = "#ECEDF1"
background_light = "#DCDFE6"
background = "#F4F5F7"
foreground = "#1E1F24"

# Text colors
text_primary = "#1E1F24"
text_secondary = "#4A4D57"
text_muted = "#7A7D88"
text_tertiary = "#7A7D88"

# Border colors
border_default = "#C4C7CF"
border_light = "#D5D8DF"
border_focus = "#8A8F9C"
border_dark = "#B4B8C2"

# Status colors
status_warn = "#B7791F"
status_error = "#C62828"
status_info = "#2B6CB0"
status_success = "#2F855A"

# Selection colors
selection_background = "#D6DEEE"
selection_text = "#1E1F24"

# Non-keypad controls (option groups, separators, memory/frac buttons)
control = "#DCDFE6"
control_hover = "#E6E8ED"
control_accent = "#E8590C"

# Single-color icon tint
icon = "#232629"

# Translucent overlays (QSS rgba, alpha in %)
control_bg = "rgba(30, 31, 36, 6%)"
control_bg_hover = "rgba(30, 31, 36, 10%)"
control_bg_pressed = "rgba(30, 31, 36, 16%)"
control_disabled_bg = "rgba(30, 31, 36, 4%)"
control_disabled_text = "rgba(232, 89, 12, 40%)"
option_checked_bg = "rgba(30, 31, 36, 10%)"
option_hover_bg = "rgba(30, 31, 36, 6%)"
toast_info_bg = "rgba(220, 223, 230, 90%)"
toast_warn_bg = "rgba(183, 121, 31, 25%)"
toast_error_bg = "rgba(198, 40, 40, 20%)"

# Display (calculator screen) background: a QSS color or gradient
screen = "#FFFFFF"
