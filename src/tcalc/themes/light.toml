# Built-in light theme
name = "Light"

[colors]
# Primary colors
primary = "#2F5FC4"
primary_hover = "#264FA6"
primary_text = "#FFFFFF"

# Secondary colors
secondary = "#FFFFFF"
secondary_hover = "#E6E8ED"
secondary_text = "#1E1F24"

# Accent colors
accent = "#E9EBF0"
accent_hover = "#DCDFE6"
accent_text = "#E8590C"

# Action colors
action = "#E3E9F3"
action_hover = "#D3DCEB"
action_text = "#2B6CB0"

# Background colors
background_dark = "#FFFFFF"
background_dark_alt = "#F7F8FA"
background_medium = "#ECEDF1"
background_light = "#DCDFE6"
background = "#F4F5F7"

# Text colors
text_primary = "#1E1F24"
text_secondary = "#4A4D57"

# Border colors
border_light = "#D5D8DF"

# Status colors
status_error = "#C62828"

# Selection colors

# Non-keypad controls (option groups, separators, memory/frac buttons)
control = "#DCDFE6"
control_hover = "#E6E8ED"

# Single-color icon tint
icon = "#232629"

# Translucent overlays (QSS rgba, alpha in %)
control_bg = "#1E1F24"
control_disabled_text = "#E8590C"
# The same in every theme: the raised edge's highlight and a shadow that darkens any background
button_highlight = "#FFFFFF"
button_shadow = "#000000"
toast_info_bg = "#DCDFE6"
toast_warn_bg = "#D8BD95"
toast_error_bg = "#E3AAAC"

# Display (calculator screen) background: a QSS color or gradient
screen = "#FFFFFF"
