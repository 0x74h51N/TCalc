# Built-in dark theme
name = "Dark"

# Gold emphasis on the dark keys instead of primary
[keypad.equals]
color = "accent"
pressed_color = "accent_hover"
text = { color = "accent_text" }

[memory]
text = { color = "accent_text" }

[options]
checked = { color = { color = "accent", opacity = 0.25 }, text_color = "accent_text" }

[history.mode]
checked = { color = { color = "accent", opacity = 0.25 }, text_color = "accent_text" }

[colors]
# Primary colors
primary = "#A6C7FF"
primary_hover = "#8FB4F5"
primary_text = "#1E1E1E"

# Secondary colors
secondary = "#3f4450"
secondary_hover = "#2a2c33"
secondary_text = "#f0f2ff"

# Accent colors
accent = "#343842"
accent_hover = "#3f4450"
accent_text = "#f3d199"

# Action colors
action = "#2f353d"
action_hover = "#252a31"
action_text = "#a6c7ff"

# Background colors
background_dark = "#1E1E1E"
background_dark_alt = "#242424"
background_medium = "#2a2c33"
background_light = "#3f4450"
background = "#1E1E1E"

# Text colors
text_primary = "#f6f7fb"
text_secondary = "#b6b8c9"

# Border colors
border_light = "#444957"

# Status colors
status_error = "#d94040"

# Selection colors

# Non-keypad controls (option groups, separators, memory/frac buttons)
control = "#343842"
control_hover = "#2a2c33"

# Single-color icon tint
icon = "#fcfcfc"

# Translucent overlays (QSS rgba, alpha in %)
control_bg = "#677596"
control_disabled_text = "#F3D199"
# The same in every theme: the raised edge's highlight and a shadow that darkens any background
button_highlight = "#FFFFFF"
button_shadow = "#000000"
toast_info_bg = "#32353D"
toast_warn_bg = "#E0A828"
toast_error_bg = "#D94040"

# Display (calculator screen) background: a QSS color or gradient
screen = "#1E1E1E"
