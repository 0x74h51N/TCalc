# Bundled example custom theme: white, pinks, bow red
name = "Kitty"
# Built-in theme it builds on; this file holds only what differs from it
base = "light"

# Overrides of the look's areas (look.toml)
[fonts]
# Miniver-Regular.ttf in this folder (OFL-1.1, see OFL-Miniver.txt)
family_default = "Miniver"
size_default = 14

[picker.text.font]
min_pt = 14

[keypad.button]
radius = 15

# Key font range (pt)
[keypad.button.text.font]
min_pt = 10
max_pt = 16

[menu.panel.text.font]
min_pt = 16

[tooltip]
radius = 14

[options]
radius = 14

[options.text.font]
min_pt = 18

[history.result.font]
min_pt = 12
max_pt = 15

[history]
icon_button_size = 20

[history.button]
radius = 10

[history.mode]
radius = 7

[history.mode.text.font]
min_pt = 14

[memory]
radius = 15



# Line-art kitty in the display's top right corner (kitty.svg, CC0, see CREDITS.txt)
[[pictures]]
file = "kitty.svg"
target = "display"
position = "top-right"
size = 0.55
fit = "contain"
opacity = 0.35
margin = 10
tint = "accent_text"

# Line-art cat at the bottom of the history list (kitty-history.svg, CC0, see CREDITS.txt)
[[pictures]]
file = "kitty-history.svg"
target = "history"
position = "bottom"
size = 0.45
fit = "contain"
opacity = 0.25
margin = 10
tint = "accent_text"

# Dock titles and tabs at the app font size, as before they had a setting
[dock.font]
min_pt = 14

[tabs.font]
min_pt = 14

[memory.text]
color = "accent_text"

[result.fraction.text]
color = "accent_text"

[colors]
primary = "#FF3D8B"
primary_hover = "#FF5C9E"
primary_text = "#2A0F1C"
secondary = "#FFC9DF"
secondary_hover = "#FFAACD"
secondary_text = "#3A1F2B"
accent = "#FF9EC3"
accent_hover = "#FF7AAC"
accent_text = "#B00028"
action = "#EC3962"
action_hover = "#D0224A"
action_text = "#FFFFFF"
background_dark = "#FFF5F9"
background_dark_alt = "#FFEAF2"
background_medium = "#FFD6E7"
background_light = "#FFC2DA"
background = "#FFE4EF"
text_primary = "#3A1F2B"
text_secondary = "#7A3E5A"
border_light = "#F8C3D9"
status_error = "#D0002E"
control = "#FFC2DA"
control_hover = "#FFD6E7"
icon = "#7A3E5A"
control_bg = "#E60033"
control_disabled_text = "#E60033"
toast_info_bg = "#FFD6E7"
toast_warn_bg = "#FFDB6C"
toast_error_bg = "#ED90A8"
screen = "#FFF5F9"
