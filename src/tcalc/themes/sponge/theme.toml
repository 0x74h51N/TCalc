# Sponge: sponge yellow, white shirt, brown pants, red tie, under the sea
name = "Sponge"
base = "light"

[fonts]
family_default = "Some Time Later"
size_default = 18

[keypad.button]
radius = 15

[keypad.button.text.font]
min_pt = 14
max_pt = 20

[menu.panel.text.font]
min_pt = 16

[picker.text]
color = "text_primary"

[picker.text.font]
min_pt = 18

[tooltip]
radius = 10

[options]
radius = 10

[options.text.font]
min_pt = 18

[history.result.font]
min_pt = 12
max_pt = 15

[history]
icon_button_size = 20

[history.button]
radius = 10

[history.mode]
radius = 2

[history.mode.text.font]
min_pt = 14

[memory]
radius = 15


[result.fraction]
radius = 40

# Sponge holes (holes.svg, drawn for TCalc) on the yellow surfaces, the sea floor behind the whole window
[[pictures]]
file = "holes.svg"
target = "display"
position = "top-right"
size = 0.6
opacity = 0.45
margin = 6

[[pictures]]
file = "holes.svg"
target = "history"
position = "bottom-right"
size = 0.45
opacity = 0.35
margin = 6

[[pictures]]
file = "undersea.svg"
target = "window"
position = "bottom"
fit = "cover"
opacity = 0.7

# Dock titles and tabs at the app font size, as before they had a setting
[dock.font]
min_pt = 18

[tabs.font]
min_pt = 18

[memory.text]
color = "text_primary"

[result.fraction.text]
color = "text_primary"

[colors]
# Display: the sponge itself
screen = "#FFF15A"
# Numbers: white shirt
secondary = "#FFFFFF"
secondary_hover = "#F1EEDC"
secondary_text = "#4A2E12"
# Operators: brown pants
accent = "#A0632B"
accent_hover = "#87511F"
accent_text = "#FFFFFF"
# ⌫ C +/- ↵: red tie
action = "#D7262E"
action_hover = "#B81E25"
action_text = "#FFFFFF"
# Equals: the sea
primary = "#2E9BD6"
primary_hover = "#49ABE0"
primary_text = "#06202F"
# Surfaces: sea water around the sponge
background = "#9ADAF5"
background_dark = "#FFFBD6"
background_dark_alt = "#FFF5B0"
background_medium = "#C9ECFA"
background_light = "#FFF15A"
text_primary = "#4A2E12"
text_secondary = "#7A5426"
border_light = "#B5E2F5"
control = "#C9ECFA"
control_hover = "#E0F4FC"
icon = "#4A2E12"
control_bg = "#A0632B"
control_disabled_text = "#D7262E"
toast_info_bg = "#C9ECFA"
status_error = "#C2181F"
