# TCalc custom theme template
# ===========================
#
# Make a theme:
#   1. Create a folder in TCalc's themes folder, e.g. themes/sunset/. The folder name is the
#      theme's id. The themes folder is in TCalc's data folder:
#        Linux    ~/.local/share/TCalc/themes/
#        Windows  %APPDATA%\TCalc\themes\
#        macOS    ~/Library/Application Support/TCalc/themes/
#   2. Copy this file into it as theme.toml.
#   3. Uncomment and change only what you want; a color you leave out comes from `base`, any
#      other value from the defaults in src/tcalc/ui/look.toml.
#   4. Put the theme's own files (pictures, fonts) in the same folder.
#   5. Open View > Theme; the theme shows up there. Its fonts load when TCalc starts, so
#      restart once after adding a font.
# A theme folder with the same name as a bundled one (kitty, retro, sponge) replaces it.
#
# Every key below is optional except `name` and `base`. A key TCalc does not know or a value of
# the wrong type is logged and skipped; the rest of the theme still applies.
# Colors are opaque: "#RRGGBB" or a color name. An alpha value is logged and skipped. How see-through
# a place is belongs to that place: hover_color = { color = "primary", opacity = 0.14 }


# --- Identity ---------------------------------------------------------------------------

# Name shown in View > Theme
# name = "Sunset"

# Built-in theme this one builds on: "light" or "dark". It gives the colors this file does
# not set, Qt's color scheme (dialogs, scrollbars...) and the light/dark icon files.
# base = "dark"


# --- Areas ------------------------------------------------------------------------------
# One table per UI area; this file is a partial copy of src/tcalc/ui/look.toml, which holds
# the defaults. Everything below is those defaults. Set only the fields you change; a table or
# field you leave out keeps its default. A field named color or ending in _color names a color
# of this file's [colors] (or of `base`), never a color. Keys, buttons and toasts cap a radius
# at half their shorter side, so a large radius makes them as round as they fit.
#
# Color fields work in every button table, for every state its widget enters. The other fields of a keypad
# kind (radius, text.font, edge, padding) are read from [keypad.button] only and have no effect in a kind's table.
# A key's table can be written on one line or as a table of its own, not both for the same key:
#   edge = { width = 2, light_color = "button_highlight" }
#   [keypad.button.edge]
#   width = 2
#
# Shared buttons: [keypad.button] sets what all the keypad keys (number, operator, action, trig,
# function, power) start from, [history.button] what the history's buttons (copy, delete, clear,
# mode) start from. So you can set one thing for all of them there, then give each kind only the
# settings you want different; or leave the shared table out and write each kind in full:
#   [keypad.button]
#   radius = 15                         # every key
#   [keypad.operator]
#   hover_color = "accent_hover"        # only the operators; they keep the radius above
# A key's hover is its own color unless a theme gives it one.
# Font files (.ttf/.otf) in the theme folder are loaded at startup; use their family name in
# [fonts].


# [fonts]
#   Fixed app font, independent of the theme and of desktop font settings (e.g. GTK's)
# family_default = "Sans Serif"
# size_default = 9
# family_monospace = "Monospace"

# [palette]
#   Qt palette: widgets without a stylesheet (dialogs, scrollbars, line edits...)
# window_color = "background"
# window_text_color = "text_primary"
# base_color = "background_dark"
# text_color = "text_primary"
# button_color = "background_light"
# button_text_color = "text_primary"
# highlight_color = "primary"
# highlighted_text_color = "primary_text"
#   Single-color icons
# icon_color = "icon"

# [display]
# background_color = "screen"
# radical_line_color = "text_primary"
# radical_symbol_color = "text_primary"
# status_text_color = "text_secondary"
# status_error_text_color = "status_error"
# divider_height = 1
# root_border_width = 2

# [display.expression]
# slot_focus_color = "background_light"
# text = { color = "text_secondary", font = { min_pt = 14, max_pt = 26 } }
# selection = { color = "primary", text_color = "primary_text" }

# [result]
# text = { color = "text_primary", font = { min_pt = 24, max_pt = 32 } }

#   The fraction toggle; text_color is its icon
# [result.fraction]
# color = { color = "control_bg", opacity = 0.06 }
# hover_color = { color = "control_bg", opacity = 0.10 }
# pressed_color = { color = "control_bg", opacity = 0.16 }
# radius = 4
# text = { color = "primary", font = { min_pt = 9, max_pt = 13 } }
# disabled = { color = { color = "control_bg", opacity = 0.04 }, text_color = { color = "control_disabled_text", opacity = 0.40 } }
# checked = { color = "primary", text_color = "primary_text" }
# edge = { width = 0, light_color = "button_highlight", shadow_color = { color = "button_shadow", opacity = 0.40 } }
# padding = { y = 6, x = 6 }

# [memory]
# color = { color = "control_bg", opacity = 0.06 }
# hover_color = { color = "control_bg", opacity = 0.10 }
# pressed_color = { color = "control_bg", opacity = 0.16 }
# radius = 0
# text = { color = "primary", font = { min_pt = 9, max_pt = 13 } }
# disabled = { color = { color = "control_bg", opacity = 0.04 }, text_color = { color = "control_disabled_text", opacity = 0.40 } }
# checked = { color = "primary", text_color = "primary_text" }
# edge = { width = 0, light_color = "button_highlight", shadow_color = { color = "button_shadow", opacity = 0.40 } }
# padding = { y = 8, x = 14 }

# [keypad]
# hover_border_color = "primary"
# symbol_color = "secondary_text"
# compact_padding = { y = 4, x = 8 }

#   Where every key starts; a key's hover is its own color unless a theme gives one; no key is disabled
# [keypad.button]
# color = "secondary"
# hover_color = "secondary"
# pressed_color = "secondary_hover"
# radius = 2
# text = { color = "secondary_text", font = { min_pt = 8, max_pt = 16 } }
# disabled = { color = { color = "control_bg", opacity = 0.04 }, text_color = { color = "control_disabled_text", opacity = 0.40 } }
# checked = { color = "primary", text_color = "primary_text" }
# edge = { width = 0, light_color = "button_highlight", shadow_color = { color = "button_shadow", opacity = 0.40 } }
# padding = { y = 0, x = 0 }

#   Never checked
# [keypad.operator]
# color = "accent"
# hover_color = "accent"
# pressed_color = "accent_hover"
# text = { color = "accent_text" }

#   Never checked
# [keypad.equals]
# color = "primary"
# hover_color = "primary"
# pressed_color = "primary_hover"
# text = { color = "primary_text" }

#   Never checked
# [keypad.action]
# color = "action"
# hover_color = "action"
# pressed_color = "action_hover"
# text = { color = "action_text" }

#   Only Shift and Hyp are checked; they draw `checked`
# [keypad.trig]
# color = "action"
# hover_color = "action"
# pressed_color = "action_hover"
# text = { color = "action_text" }

#   Never checked
# [keypad.function]
# color = "accent"
# hover_color = "accent"
# pressed_color = "accent_hover"
# text = { color = "accent_text" }

# [custom_pad]
# spinbox_focus_border_color = "primary"
# toolbar_separator_color = "control"

#   The add key of the custom pad; text.color is its icon; its edge and radius are the keys' [keypad.button] ones; never checked or disabled
# [custom_pad.add_key]
# color = "accent"
# hover_color = "accent_hover"
# pressed_color = "accent_hover"
# radius = 2
# text = { color = "accent_text", font = { min_pt = 8, max_pt = 16 } }
# disabled = { color = { color = "control_bg", opacity = 0.04 }, text_color = { color = "control_disabled_text", opacity = 0.40 } }
# checked = { color = "primary", text_color = "primary_text" }
# edge = { width = 0, light_color = "button_highlight", shadow_color = { color = "button_shadow", opacity = 0.40 } }
# padding = { y = 0, x = 0 }

#   The row and column spin boxes; never checked or disabled
# [custom_pad.spinbox]
# color = "control"
# hover_color = "control"
# pressed_color = "control_hover"
# radius = 2
# text = { color = "text_primary", font = { min_pt = 8, max_pt = 16 } }
# disabled = { color = { color = "control_bg", opacity = 0.04 }, text_color = { color = "control_disabled_text", opacity = 0.40 } }
# checked = { color = "primary", text_color = "primary_text" }
# edge = { width = 0, light_color = "button_highlight", shadow_color = { color = "button_shadow", opacity = 0.40 } }
# padding = { y = 0, x = 0 }

# [custom_pad.menu]
# background_color = "background_medium"
# border_color = "border_light"
# hover_color = "primary"
# separator_color = "control"
# list_background_color = "background_dark"
# radius = 2
# text = { color = "text_primary", font = { min_pt = 9, max_pt = 9 } }
# padding = { y = 0, x = 0 }

#   The searchable picker; font in pt
# [picker]
# background_color = "background_medium"
# border_color = "border_light"
# hover_color = { color = "primary", opacity = 0.14 }
# separator_color = "border_light"
# list_background_color = "background_dark"
# radius = 2
# text = { color = "text_primary", font = { min_pt = 9, max_pt = 9 } }
# padding = { y = 0, x = 0 }

# [menu]
# selected_border_color = "primary"
# constants_symbol_color = "text_primary"
# item_margin = 2
# item_min_width = 70
# icon_padding_left = 6
# icon_padding_right = 4
# separator_height = 1
# separator_margin = { y = 4, x = 2 }

#   The menu's frame; font in px; hover_color has no effect here (a row's hover is [menu.item] hover_color)
# [menu.panel]
# background_color = "background_medium"
# border_color = "border_light"
# hover_color = { color = "primary", opacity = 0.14 }
# separator_color = "border_light"
# list_background_color = "background_dark"
# radius = 2
# text = { color = "text_primary", font = { min_pt = 14, max_pt = 14 } }
# padding = { y = 4, x = 4 }

#   A menu item; checked is the selected item; pressed_color has no effect (a menu item has no pressed state)
# [menu.item]
# color = "background_medium"
# hover_color = "primary"
# pressed_color = { color = "primary", opacity = 0.14 }
# radius = 6
# text = { color = "text_primary", font = { min_pt = 9, max_pt = 13 } }
# disabled = { color = "background_medium", text_color = "text_secondary" }
# checked = { color = "primary", text_color = "primary_text" }
# edge = { width = 0, light_color = "button_highlight", shadow_color = { color = "button_shadow", opacity = 0.40 } }
# padding = { y = 4, x = 12 }

# [history]
# background_color = "background_dark"
# row_color = "background_dark_alt"
# alternate_row_color = "background_dark"
#   Math mode render size (pt)
# math_font_size = 17
#   The copy and delete buttons of an item (px)
# icon_button_size = 22
#   The list's font range (pt)
#   The Clear History button
# text = { color = "text_secondary", font = { min_pt = 7, max_pt = 12 } }
# selected = { color = { color = "primary", opacity = 0.24 }, text_color = "text_secondary" }
# delete = { text = { color = "status_error" } }
# clear = { hover_color = "primary", pressed_color = "background_dark", text = { color = "text_primary", font = { min_pt = 7, max_pt = 10 } } }

#   An item's expression (also in math mode)
# [history.expression]
# color = "text_secondary"
# font = { min_pt = 10, max_pt = 15 }

#   An item's result
# [history.result]
# color = "text_secondary"
# font = { min_pt = 7, max_pt = 12 }

#   Where the history's buttons start: copy, delete, clear and the modes read what they do not set; only the modes are ever checked, none is disabled
# [history.button]
# color = "background_light"
# hover_color = { color = "primary", opacity = 0.14 }
# pressed_color = "background_dark"
# radius = 2
# text = { color = "icon", font = { min_pt = 7, max_pt = 12 } }
# disabled = { color = { color = "control_bg", opacity = 0.04 }, text_color = { color = "control_disabled_text", opacity = 0.40 } }
# checked = { color = "primary", text_color = "primary_text" }
# edge = { width = 1, light_color = "border_light", shadow_color = { color = "button_shadow", opacity = 0.40 } }
# padding = { y = 0, x = 0 }

#   The Math / Flat / Raw buttons, an option group of their own; never disabled
# [history.mode]
# color = { color = "background", opacity = 0 }
# hover_color = { color = "primary", opacity = 0.14 }
# pressed_color = { color = "primary", opacity = 0.14 }
# radius = 2
# text = { color = "text_secondary", font = { min_pt = 9, max_pt = 9 } }
# edge = { width = 0, light_color = "button_highlight", shadow_color = { color = "button_shadow", opacity = 0.40 } }
# padding = { y = 4, x = 10 }

#   Option groups (Deg/Rad/Grad...); never disabled
# [options]
# color = { color = "background", opacity = 0 }
# hover_color = { color = "primary", opacity = 0.14 }
# pressed_color = { color = "primary", opacity = 0.14 }
# radius = 2
# text = { color = "text_secondary", font = { min_pt = 9, max_pt = 9 } }
# disabled = { color = { color = "control_bg", opacity = 0.04 }, text_color = { color = "control_disabled_text", opacity = 0.40 } }
# checked = { color = "primary", text_color = "primary_text" }
# edge = { width = 0, light_color = "button_highlight", shadow_color = { color = "button_shadow", opacity = 0.40 } }
# padding = { y = 4, x = 10 }

#   The icon buttons without a look of their own (custom pad and preset toolbars); text.font, checked and disabled have no effect
# [icon_button]
# color = "accent"
# hover_color = "accent_hover"
# pressed_color = "accent_hover"
# radius = 2
# text = { color = "accent_text", font = { min_pt = 9, max_pt = 9 } }
# disabled = { color = { color = "control_bg", opacity = 0.04 }, text_color = { color = "control_disabled_text", opacity = 0.40 } }
# checked = { color = "primary", text_color = "primary_text" }
# edge = { width = 0, light_color = "button_highlight", shadow_color = { color = "button_shadow", opacity = 0.40 } }
# padding = { y = 4, x = 4 }

# [tooltip]
# background_color = "background_dark"
# border_color = "border_light"
# hover_color = { color = "primary", opacity = 0.14 }
# separator_color = "border_light"
# list_background_color = "background_dark"
# radius = 2
# text = { color = "text_secondary", font = { min_pt = 9, max_pt = 9 } }
# padding = { y = 2, x = 2 }

# [toast]
# info_color = { color = "toast_info_bg", opacity = 0.90 }
# warn_color = { color = "toast_warn_bg", opacity = 0.55 }
# error_color = { color = "toast_error_bg", opacity = 0.55 }
# radius = 4
# text = { color = "text_primary", font = { min_pt = 13, max_pt = 13 } }
# padding = { y = 6, x = 10 }

#   The title bar of a dock
# [dock]
# color = "text_primary"
# font = { min_pt = 9, max_pt = 9 }

#   The tab bar of docks stacked as tabs; a tab background or radius would drop the style's own tab
# [tabs]
# color = "text_primary"
# font = { min_pt = 9, max_pt = 9 }


# --- Pictures ---------------------------------------------------------------------------
# Pictures painted behind a component. Add one [[pictures]] table per picture.

# [[pictures]]
# file = "picture.svg"      # in this folder; SVG or PNG
# target = "display"        # window (the whole window, behind keypads and docks) | display |
#                           # history | main_keypad | functions_keypad | trig_keypad | custom_pad
# position = "top-right"    # center | top-left | top | top-right | left | right |
#                           # bottom-left | bottom | bottom-right
# size = 0.5                # box size as a fraction of the component's width and height (0-1)
# fit = "contain"           # contain: whole picture, aspect kept
#                           # cover: fills the box, aspect kept, overflow cropped
#                           # stretch: fills the box exactly
# opacity = 0.35            # 0 (invisible) to 1 (solid)
# margin = 10               # px kept free from the component's edges
# tint = "accent_text"      # optional: repaint the picture in one of the colors below
#                           # (handy for line art); leave out to keep its own colors
#
# A key color with an opacity, color = { color = "secondary", opacity = 0.75 }, lets a keypad picture show through.


# --- Colors -----------------------------------------------------------------------------

# A theme can add its own color names next to the ones below and use them anywhere a color is named,
# e.g. sunset_orange = "#FF8800" here, then [keypad.operator] color = "sunset_orange". A name that is in
# neither this [colors] nor `base`'s is logged and that place keeps its default.

# [colors]

# Calculator screen
# screen = "#1E1E1E"               # display background; a color or a QSS gradient, e.g. scanlines:
#                                  # "qlineargradient(spread:repeat, x1:0, y1:0, x2:0, y2:0.01,
#                                  #  stop:0 #0C4A0C, stop:0.5 #0C4A0C, stop:0.51 #063006,
#                                  #  stop:1 #063006)"

# Keypad keys (background / pressed background / label)
# secondary = "#3f4450"            # numbers and power keys
# secondary_hover = "#2a2c33"
# secondary_text = "#f0f2ff"       # also: math symbols drawn on keys
# accent = "#343842"               # operators and function keys
# accent_hover = "#3f4450"
# accent_text = "#f3d199"          # also: key hover border
# action = "#2f353d"               # ⌫ C +/- ↵ and trig keys
# action_hover = "#252a31"
# action_text = "#a6c7ff"

# Surfaces
# background = "#1E1E1E"           # window background: menu bar, behind keypads, dock titles
# background_dark = "#1E1E1E"      # history list, tooltips, memory bar strip, text fields
# background_dark_alt = "#242424"  # alternate history rows
# background_medium = "#2a2c33"    # menus, keypad option rows
# background_light = "#3f4450"     # icon buttons, expression slot focus, Qt button color

# Text
# text_primary = "#f6f7fb"         # main text: result, menus, labels
# text_secondary = "#b6b8c9"       # expression line, history, secondary labels, tooltips

# Lines and selection
# border_light = "#444957"         # menu borders and separators, keypad borders
# primary = "#A6C7FF"              # the color of emphasis: selected, checked, focus, the main action
# primary_hover = "#8FB4F5"        # a primary surface when pressed
# primary_text = "#1E1E1E"         # on primary; at least 4.5:1 on primary and on primary_hover
#                                  # memory and fraction text need 4.5:1 on background: name another color there if primary cannot

# Other controls (option groups, memory and fraction buttons, angle toggle)
# control = "#343842"
# control_hover = "#2a2c33"
# control_bg = "#677596"               # memory bar and fraction button
# control_disabled_text = "#F3D199"
# button_highlight = "#FFFFFF"           # the raised edge's lit side
# button_shadow = "#000000"             # the raised edge's shadow side

# Icons and messages
# icon = "#fcfcfc"                 # single-color icons (colored icons keep their colors)
# status_error = "#d94040"         # error message under the result
# toast_info_bg = "#32353D"             # notification backgrounds
# toast_warn_bg = "#E0A828"
# toast_error_bg = "#D94040"

