# UI Window Layout Configuration

[window]
# Minimum dimensions (pixels)
min_height = 520
calc_min_width = 450
history_min_width = 320
numpad_min_width = 300
funcpad_min_width = 150
trigpad_min_width = 150

# Main window layout
layout_margins = 0
layout_spacing = 0
divider_line_width = 1

# sizeHint fallback when no central widget sizeHint
size_hint_width = 600
size_hint_height = 300

# Layout stretch ratios
calc_stretch = 3
history_stretch = 1

[style]
tooltip_padding = 2

# OptionGroup (reusable radio-button group) style
[style.option_group]
padding_y = 4
padding_x = 10

# ---------------------------------------------------------------------------
# Icons
# ---------------------------------------------------------------------------
[icons]
# Multi-color and red icons keep their own colors; all others take the theme's icon color
untinted = [
    "accessories-calculator",
    "application-exit",
    "edit-delete",
    "edit-delete-shred",
    "snap-angle-symbolic",
]

# ---------------------------------------------------------------------------
# Toast notifications
# ---------------------------------------------------------------------------
[toast]
pad_y = 6
pad_x = 10
border_radius = 4
font_size = 13

# ---------------------------------------------------------------------------
# Side panel (reusable container for history / future left-panel / etc.)
# ---------------------------------------------------------------------------
[side_panel]
margin = 10
spacing = 6
resize_debounce_ms = 30

# ---------------------------------------------------------------------------
# History panel
# ---------------------------------------------------------------------------
[history]
max_items = 100

[history.style]
button_spacer_stretch = 1
clear_button_stretch = 1

item_padding = 4
item_min_height = 70
item_margin = 10
item_spacing = 10
action_btn_size = 22

font_size = 7
wrap_padding_factor = 3
max_pt = 12
expr_min_pt = 10
expr_max_pt = 15
result_min_pt = 8
result_max_pt = 12

btn_margin = 6

clr_btn_min_pt = 7
clr_btn_max_pt = 10

[history.math]
base_font = 17
scale_main = 1.0
scale_aux = 1.0
scale_script = 0.5

# ---------------------------------------------------------------------------
# Memory bar
# ---------------------------------------------------------------------------
[memory.style]
font_size = 9
max_pt = 13
divider_spacing = 4


[keypad]
top_margin = 10
side_margin = 10
bottom_margin = 10
grid_spacing = 2
hbox_spacing = 18
hbox_stretch = 1

# Grid stretch ratios
normal_mode_keys_stretch = 8
right_side_grid_stretch = 2
science_grid_stretch = 4

column_split = 3

min_pt = 8
max_pt = 14

keypad_stretch = 5

# Base keypad button padding (px)
button_padding = 0

[keypad.custom]
default_cols = 1
default_rows = 1
default_max_rows = 6

# Limits
min_cols = 1
max_cols = 6
min_grid_rows = 1
max_grid_rows = 4
min_rows = 1
max_rows = 24

# Toolbar (edit mode)
toolbar_margin = 2
toolbar_spacing = 4
spin_width = 70

# Operation picker popup
picker_min_width = 200
picker_margin = 4
picker_spacing = 2
picker_list_height = 240
picker_list_margin_left = 10
picker_list_margin_top = 2
picker_list_margin_right = 2
picker_list_margin_bottom = 2

# ---------------------------------------------------------------------------
# Calc widget (display + topbar)
# ---------------------------------------------------------------------------
[calc.layout]
display_stretch = 5
divider_line_width = 1

[calc.style]
compact_pad_y = 4
compact_pad_x = 8

[calc.display]
margin = 10
spacing = 6
divider_height = 1
root_border_width = 2

# Font sizes
expression_font_size = 14

# Expression line sizing
expression_height_factor = 1.8
expression_min_height = 30

expr_max_pt = 26

# Scroll animation
scroll_anim_duration = 140
scroll_anim_curve = "InCubic"

[calc.display.result]
height = 110
font_size = 24
max_pt = 32
font_norm = 8  # FractionWidget font size normalizer
resize_debounce_ms = 30

btn_size = 32
btn_padding = 6
btn_radius = 4

frac_icon = "frac"
frac_icon_tint = "control_accent"
decimal_icon = "decimal"

[calc.topbar]
side_margin = 10
top_margin = 10
bottom_margin = 5
grid_spacing = 2
spacer_stretch = 1

# Memory button layout (px)
memory_pad_y = 8
memory_pad_x = 14

# ---------------------------------------------------------------------------
# Menu bar
# ---------------------------------------------------------------------------
[manubar.style]
menu_font_size = 14
item_padding_horizontal = 12
item_padding_vertical = 4
item_margin = 2
item_min_width = 70
item_border_radius = 6

icon_padding_left = 6
icon_padding_right = 4

separator_height = 1
separator_margin_vertical = 4
separator_margin_horizontal = 2

menu_padding = 4

[manubar.preset]
# Custom layout-preset row + its floating action bar
row_icon = "custom_pad"
rename_icon = "insert-text"
update_icon = "document-save"
delete_icon = "edit-delete"
action_btn_size = 24
action_spacing = 0
bar_offset = 4
