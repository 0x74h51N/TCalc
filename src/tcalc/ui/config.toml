# UI Window Layout Configuration

[window]
# Minimum dimensions (pixels)
min_height = 520
calc_min_width = 450
history_min_width = 320
science_panel_width = 120

# Main window layout
layout_margins = 0
layout_spacing = 0
divider_line_width = 1

# sizeHint fallback when no central widget sizeHint
size_hint_width = 600
size_hint_height = 300

# Layout stretch ratios
calc_stretch = 3
history_stretch = 1

[style]
tooltip_padding = 2

# OptionGroup (reusable radio-button group) style
[style.option_group]
checked_alpha = 0.25
hover_alpha = 0.35
padding_y = 4
padding_x = 10

# ---------------------------------------------------------------------------
# Side panel (reusable container for history / future left-panel / etc.)
# ---------------------------------------------------------------------------
[side_panel]
margin = 10
spacing = 6

# ---------------------------------------------------------------------------
# History panel
# ---------------------------------------------------------------------------
[history]
max_items = 100

[history.style]
button_spacer_stretch = 1
clear_button_stretch = 1

item_padding = 4
item_min_height = 70
item_margin = 10
item_spacing = 10
action_btn_size = 22

font_size = 7
wrap_padding_factor = 3
max_pt = 12
expr_min_pt = 10
expr_max_pt = 15
result_min_pt = 8
result_max_pt = 12

btn_margin = 6

clr_btn_min_pt = 7
clr_btn_max_pt = 10

[history.math]
base_font = 11
max_pt = 18
scale_main = 1.0
scale_aux = 1.0
scale_script = 0.5

# ---------------------------------------------------------------------------
# Memory bar
# ---------------------------------------------------------------------------
[memory.style]
font_size = 9
max_pt = 13
divider_spacing = 4


[keypad]
top_margin = 10
side_margin = 10
bottom_margin = 10
grid_spacing = 2
hbox_spacing = 18
hbox_stretch = 1

# Grid stretch ratios
normal_mode_keys_stretch = 8
right_side_grid_stretch = 2
science_grid_stretch = 4

column_split = 3

min_pt = 4
max_pt = 20

keypad_stretch = 5

# Base keypad button padding (px)
button_padding = 10

# ---------------------------------------------------------------------------
# Calc widget (display + topbar)
# ---------------------------------------------------------------------------
[calc.layout]
display_stretch = 5
divider_line_width = 1

[calc.style]
disabled_background_alpha = 0.1
disabled_text_alpha = 0.3
compact_button_padding_y = 4
compact_button_padding_x = 8

[calc.display]
margin = 10
spacing = 6
divider_height = 1
root_border_width = 2

# Font sizes
expression_font_size = 14
result_font_size = 16

# Expression line sizing
expression_height_factor = 1.8
expression_min_height = 30

# Font/height scale ratios by input kind (relative to MAIN)
scale_main = 1.0
scale_aux = 1.0
scale_script = 0.5

[calc.display.font_scale.expression]
max_pt = 26

[calc.display.font_scale.result]
max_pt = 30

[calc.topbar]
side_margin = 10
top_margin = 10
bottom_margin = 5
grid_spacing = 2
spacer_stretch = 1

# Memory button alpha multipliers
memory_background_alpha = 0.2
memory_background_hover_alpha = 0.28
memory_background_pressed_alpha = 0.38
