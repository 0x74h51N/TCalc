# UI Window Layout Configuration

[window]
# Minimum dimensions (pixels)
min_height = 520
calc_min_width = 450
history_min_width = 320
numpad_min_width = 300
funcpad_min_width = 150
trigpad_min_width = 150

# Main window layout
layout_margins = 0
layout_spacing = 0
divider_line_width = 1

# sizeHint fallback when no central widget sizeHint
size_hint_width = 600
size_hint_height = 300

# Layout stretch ratios
calc_stretch = 3
history_stretch = 1

[style]
tooltip_padding = 2

# OptionGroup (reusable radio-button group) style
[style.option_group]
checked_base = "accent"
checked_alpha = 0.25
hover_base = "secondary_hover"
hover_alpha = 0.35
padding_y = 4
padding_x = 10

# ---------------------------------------------------------------------------
# Toast notifications
# ---------------------------------------------------------------------------
[toast]
pad_y = 6
pad_x = 10
border_radius = 4
font_size = 13
alpha = 140
info_base = "background_light"
warn_base = "status_warn"
error_base = "status_error"

# ---------------------------------------------------------------------------
# Side panel (reusable container for history / future left-panel / etc.)
# ---------------------------------------------------------------------------
[side_panel]
margin = 10
spacing = 6

# ---------------------------------------------------------------------------
# History panel
# ---------------------------------------------------------------------------
[history]
max_items = 100

[history.style]
button_spacer_stretch = 1
clear_button_stretch = 1

item_padding = 4
item_min_height = 70
item_margin = 10
item_spacing = 10
action_btn_size = 22

font_size = 7
wrap_padding_factor = 3
max_pt = 12
expr_min_pt = 10
expr_max_pt = 15
result_min_pt = 8
result_max_pt = 12

btn_margin = 6

clr_btn_min_pt = 7
clr_btn_max_pt = 10

[history.math]
base_font = 11
max_pt = 18
scale_main = 1.0
scale_aux = 1.0
scale_script = 0.5

# ---------------------------------------------------------------------------
# Memory bar
# ---------------------------------------------------------------------------
[memory.style]
font_size = 9
max_pt = 13
divider_spacing = 4


[keypad]
top_margin = 10
side_margin = 10
bottom_margin = 10
grid_spacing = 2
hbox_spacing = 18
hbox_stretch = 1

# Grid stretch ratios
normal_mode_keys_stretch = 8
right_side_grid_stretch = 2
science_grid_stretch = 4

column_split = 3

min_pt = 8
max_pt = 14

keypad_stretch = 5

# Base keypad button padding (px)
button_padding = 0

[keypad.custom]
default_cols = 1
default_rows = 1
default_max_rows = 6

# Limits
min_cols = 1
max_cols = 6
min_grid_rows = 1
max_grid_rows = 4
min_rows = 1
max_rows = 24

# Toolbar (edit mode)
toolbar_margin = 2
toolbar_spacing = 4
spin_width = 70

# Operation picker popup
picker_min_width = 200
picker_margin = 4
picker_spacing = 2
picker_list_height = 240
picker_list_margin_left = 10
picker_list_margin_top = 2
picker_list_margin_right = 2
picker_list_margin_bottom = 2

# Colors (theme color key references)
[keypad.custom.colors]
context_menu_bg = "background_medium"
context_menu_text = "text_primary"
context_menu_hover = "selection_background"

picker_bg = "background_medium"
picker_text = "text_primary"
picker_border = "border_light"
picker_search_bg = "background_dark"
picker_search_text = "text_primary"
picker_list_bg = "background_dark"
picker_list_hover = "selection_background"
picker_list_text = "text_primary"

spin_bg = "accent"
spin_text = "secondary_text"
spin_focus_border = "accent_text"

separator = "accent"
toolbar_separator = "accent"

add_button_bg = "accent"
add_button_hover_bg = "secondary_hover"

key_bg = "secondary"
key_text = "secondary_text"
key_hover_border = "accent_text"
key_pressed_bg = "secondary_hover"
key_disabled_bg = "disabled_bg"
key_disabled_text = "disabled_text"
key_disabled_border = "disabled_bg"
key_checked_bg = "action_hover"

operator_bg = "accent"
operator_text = "accent_text"
operator_pressed_bg = "accent_hover"

action_bg = "action"
action_text = "action_text"
action_pressed_bg = "action_hover"

equals_bg = "primary"
equals_text = "primary_text"
equals_border = "border_focus"
equals_pressed_bg = "primary_hover"

trig_bg = "action"
trig_text = "action_text"
trig_pressed_bg = "action_hover"

function_bg = "accent"
function_text = "accent_text"
function_pressed_bg = "accent_hover"

power_bg = "secondary"
power_text = "secondary_text"
power_pressed_bg = "secondary_hover"

# ---------------------------------------------------------------------------
# Calc widget (display + topbar)
# ---------------------------------------------------------------------------
[calc.layout]
display_stretch = 5
divider_line_width = 1

[calc.style]
compact_pad_y = 4
compact_pad_x = 8

[calc.style.colors]
disabled_bg = ["secondary_hover", 0.1]
disabled_text = ["accent_text", 0.3]

[calc.display]
margin = 10
spacing = 6
divider_height = 1
root_border_width = 2

# Font sizes
expression_font_size = 14
result_font_size = 16

# Expression line sizing
expression_height_factor = 1.8
expression_min_height = 30

# Font/height scale ratios by input kind (relative to MAIN)
scale_main = 1.0
scale_aux = 1.0
scale_script = 0.5

expr_max_pt = 26
rslt_max_pt = 30

# Scroll animation
scroll_anim_duration = 140
scroll_anim_curve = "InCubic"

[calc.topbar]
side_margin = 10
top_margin = 10
bottom_margin = 5
grid_spacing = 2
spacer_stretch = 1

# Memory button layout (px)
memory_pad_y = 8
memory_pad_x = 14

# Memory button colors: [base, alpha] pairs  (base = theme color key)
[calc.topbar.memory_colors]
memory_bg = ["accent", 0.2]
memory_bg_hover = ["accent", 0.28]
memory_bg_pressed = ["accent", 0.38]
memory_disabled_bg = ["secondary_hover", 0.1]
memory_disabled_text = ["accent_text", 0.3]

# ---------------------------------------------------------------------------
# Menu bar
# ---------------------------------------------------------------------------
[manubar.style]
menu_font_size = 14
item_padding_horizontal = 12
item_padding_vertical = 4
item_margin = 2
item_min_width = 70
item_border_radius = 6

icon_padding_left = 6
icon_padding_right = 4

separator_height = 1
separator_margin_vertical = 4
separator_margin_horizontal = 2

menu_padding = 4

# Color references (theme color keys)
menu_background = "background_medium"
menu_text = "text_primary"
menu_border = "border_light"
selected_background = "selection_background"
selected_text = "selection_text"
selected_border = "border_focus"
disabled_text = "text_secondary"
separator_color = "border_light"
